<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:0;background:#f4f7f5;color:#1d2b25}

<script>
/* ---------- constants ---------- */
const TYPES=["Income","Expense","PayLater Payment","Pass-through In","Pass-through Out","Transfer In","Transfer Out"];
const INS=["Income","Pass-through In","Transfer In"];
const ACCTS=["BCA","ShopeePay","GoPay","Cash","ShopeePayLater","Unknown"];
const BUCKETS=["Necessities","Culture","Discretionary","Miscellaneous"];
const TRIGGERS=["Bored","Sad / stressed","Sale / voucher","FOMO / trend","Scrolling social media","Reward myself","Late-night scrolling","Genuine need"];
const SUBS={
"Mom allowance":"Income","Side hustle / freelance":"Income","Jastip markup":"Income","Friend repayment / other":"Income","Salary (future)":"Income","Scholarship / stipend (future)":"Income",
"Cat care":"Necessities","Food & groceries":"Necessities","Household":"Necessities","Personal care":"Necessities","Phone & data":"Necessities","Transport":"Necessities","Health & medical":"Necessities","Utilities (future)":"Necessities","Rent (future)":"Necessities",
"Books & learning":"Culture","Courses":"Culture","Hobbies":"Culture","Entertainment":"Culture",
"Eating out & drinks":"Discretionary","Shopping & clothes":"Discretionary","Gifts":"Discretionary","Charity / Sedekah":"Discretionary",
"Shipping & logistics":"Miscellaneous","Fees & admin":"Miscellaneous","Irregular / annual":"Miscellaneous","Other":"Miscellaneous",
"PayLater repayment":"Non-budget","Transfer between accounts":"Non-budget","Jastip pass-through":"Non-budget","Savings / investing":"Non-budget"};
const EXP_SUBS=Object.keys(SUBS).filter(k=>BUCKETS.includes(SUBS[k]));
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=x=>String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt=n=>(n<0?"-":"")+"Rp "+Math.abs(Math.round(n)).toLocaleString("id-ID");
const pct=x=>x===null||!isFinite(x)?"":(x*100).toFixed(1)+"%";
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const nowYM=()=>today().slice(0,7);
function addM(ym,n){let [y,m]=ym.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+String(m+1).padStart(2,"0");}
function addDays(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
const opts=(arr,v)=>arr.map(a=>`<option${a===v?" selected":""}>${esc(a)}</option>`).join("");
const cls=n=>n<0?"neg":"";

/* ---------- calculations ---------- */
function mo(ym){
 const x=s.tx.filter(t=>t.date.slice(0,7)===ym);
 const S=f=>x.filter(f).reduce((a,t)=>a+t.amt,0);
 const e=t=>t.type==="Expense";
 const o={inc:S(t=>t.type==="Income"),exp:S(e)};
 o.net=o.inc-o.exp;
 BUCKETS.forEach(b=>o[b]=S(t=>e(t)&&SUBS[t.sub]===b));
 o.charity=S(t=>e(t)&&t.sub==="Charity / Sedekah");
 o.pl=S(t=>e(t)&&t.acct==="ShopeePayLater");
 o.imp=S(t=>e(t)&&t.flag==="Impulse");
 return o;
}
function subSum(ym,sub,type){return s.tx.filter(t=>t.date.slice(0,7)===ym&&t.type===type&&t.sub===sub).reduce((a,t)=>a+t.amt,0);}
function balNow(a){
 const moved=s.tx.filter(t=>t.acct===a&&a!=="ShopeePayLater"&&t.date>s.asOf).reduce((m,t)=>m+(INS.includes(t.type)?t.amt:-t.amt),0);
 return(s.bal[a]||0)+moved;
}
const cashTotal=()=>["BCA","ShopeePay","GoPay","Cash"].reduce((a,k)=>a+balNow(k),0);
const cashYours=()=>cashTotal()-(s.held||0);
function dueFor(date){const d=new Date(date+"T00:00:00");let y=d.getFullYear(),m=d.getMonth()+(d.getDate()<=24?1:2);y+=Math.floor(m/12);m=m%12;return y+"-"+String(m+1).padStart(2,"0")+"-05";}
function cycleLabel(due){const a=addM(due.slice(0,7),-2),b=addM(due.slice(0,7),-1);return"25 "+MONTHS[+a.slice(5)-1]+" - 24 "+MONTHS[+b.slice(5)-1];}
function plObligations(){
 const o=[];
 s.bills.filter(b=>b.status==="Unpaid"&&b.bill-b.refund-b.settled>0).forEach(b=>o.push({due:b.due,label:b.name+" (from Shopee app)",amt:b.bill-b.refund-b.settled}));
 const g={};
 s.tx.filter(t=>t.type==="Expense"&&t.acct==="ShopeePayLater"&&t.date>s.asOf).forEach(t=>{const d=dueFor(t.date);g[d]=(g[d]||0)+t.amt;});
 Object.keys(g).forEach(d=>o.push({due:d,label:"Purchases you logged, cycle "+cycleLabel(d),amt:g[d]}));
 o.sort((a,b)=>a.due.localeCompare(b.due));
 let P=s.tx.filter(t=>t.type==="PayLater Payment"&&t.date>s.asOf).reduce((a,t)=>a+t.amt,0);
 o.forEach(x=>{const q=Math.min(P,x.amt);x.paid=q;x.rem=x.amt-q;P-=q;});
 return{list:o,extra:P};
}
const unpaidBills=()=>plObligations().list.reduce((a,x)=>a+x.rem,0);
const invAdd=id=>s.tx.filter(t=>t.target===id&&t.date>s.asOf).reduce((a,t)=>a+(t.type==="Transfer Out"?t.amt:t.type==="Transfer In"?-t.amt:0),0);
const invVal=i=>i.value+invAdd(i.id);
const invCost=i=>i.cost+invAdd(i.id);
const invTotal=()=>s.inv.reduce((a,i)=>a+invVal(i),0);
const budgetOf=b=>s.baseline*(s.pcts[b]||0)/100;
function waitDays(p){return p<=50000?1:p<=200000?3:p<=1000000?7:14;}

function addTx(){

 const amt=+g("f_amt"),type=g("f_type"),acct=g("f_acct");let sub=g("f_sub");
 if(!g("f_date")||!amt||amt<=0){alert("Please add a date and an amount above 0.");return;}
 if(type==="PayLater Payment"){sub="PayLater repayment";if(acct==="ShopeePayLater"){alert("Pick the account the money came out of (BCA, ShopeePay, GoPay or Cash).");return;}}

 s.tx.push({id:uid(),date:g("f_date"),type,acct,sub,desc:g("f_desc"),amt,flag:g("f_flag"),guess:false,note:"",target});
 save();render();
}

/* ---------- export / import ---------- */
function download(name,mime,content){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function tbl(title,head,rows){
 return`<table border="1"><caption><b>${esc(title)}</b></caption><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table><br>`;
}
function exportXls(){
 const yms=MONTHS.map((_,i)=>yearSel+"-"+String(i+1).padStart(2,"0"));
 const d=yms.map(mo);
 const line=(n,f)=>[n,...d.map(f),d.reduce((a,x)=>a+f(x),0)];
 let h="<html xmlns:x='urn:schemas-microsoft-com:office:excel'><head><meta charset='utf-8'></head><body>";
 h+=tbl("Transactions",["Date","Type","Account","Category","Subcategory","Description","Amount","Planned/Impulse"],s.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.acct,SUBS[t.sub]||"",t.sub,t.desc,t.amt,t.flag]));
 h+=tbl("Cash flow "+yearSel,["Rp",...MONTHS,"Year"],[line("Income",x=>x.inc),line("Expenses",x=>x.exp),line("Net cash flow",x=>x.net),...BUCKETS.map(b=>line(b,x=>x[b])),line("Charity / Sedekah",x=>x.charity),line("Spent on ShopeePayLater",x=>x.pl),line("Impulse spending",x=>x.imp)]);
 h+=tbl("Accounts (as of "+s.asOf+" plus later transactions)",["Account","Balance now"],[...["BCA","ShopeePay","GoPay","Cash"].map(a=>[a,balNow(a)]),["Held for others",s.held],["Truly yours",cashYours()]]);
 h+=tbl("ShopeePayLater (what I owe)",["Due","What","Owed","Paid","Remaining"],plObligations().list.map(x=>[x.due,x.label,x.amt,x.paid,x.rem]));
 h+=tbl("Savings & investing",["Group","Instrument","Cost","Current value","Coupons","Gain/loss"],s.inv.map(i=>[i.group,i.name,invCost(i),invVal(i),i.coupons,invVal(i)-invCost(i)+i.coupons]));
 h+="</body></html>";
 download("Camilla_Money_Planner.xls","application/vnd.ms-excel",h);

function exportCsv(){
 const q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"';
 const rows=[["date","type","account","subcategory","category","description","amount","flag","invest_into"]].concat(s.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.acct,t.sub,SUBS[t.sub]||"",t.desc,t.amt,t.flag,(s.inv.find(i=>i.id===t.target)||{}).name||""]));
 download("Camilla_transactions.csv","text/csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"));
}
function parseCsv(txt){
 const out=[];let row=[],cur="",inq=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(inq){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;}
  else if(c==='"')inq=true;
  else if(c===","||c===";"){row.push(cur);cur="";}
  else if(c==="\n"){row.push(cur);out.push(row);row=[];cur="";}
  else if(c!=="\r")cur+=c;}
 if(cur||row.length){row.push(cur);out.push(row);}
 return out;
}
function importCsv(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const rows=parseCsv(String(r.result).replace(/^﻿/,""));
  const hd=rows.shift().map(x=>x.trim().toLowerCase());
  const ix=n=>hd.indexOf(n);
  let n=0;
  rows.forEach(c=>{
   const date=c[ix("date")],amt=+c[ix("amount")];
   if(!date||!amt)return;
   const type=TYPES.includes(c[ix("type")])?c[ix("type")]:"Expense";
   const sub=SUBS[c[ix("subcategory")]]?c[ix("subcategory")]:"Other";
   s.tx.push({id:uid(),date,type,acct:ACCTS.includes(c[ix("account")])?c[ix("account")]:"Unknown",sub,desc:c[ix("description")]||"",amt,flag:c[ix("flag")]||"",guess:false,note:"",target:((s.inv.find(i=>i.name===c[ix("invest_into")])||{}).id)||""});n++;
  });
  save();render();alert(n+" transactions imported. Dates must look like 2026-10-30.");
 };
 r.readAsText(f);inp.value="";
}

/* ---------- cloud sync (Google Sheet via Apps Script) ---------- */
const SYNC_KEY="camSync";
let sync={url:"",token:"",last:0,status:""};
try{Object.assign(sync,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"));}catch(e){}
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({url:sync.url,token:sync.token,last:sync.last}));}catch(e){}}
function setStatus(t){sync.status=t;["syncstat","syncstat2"].forEach(i=>{const el=document.getElementById(i);if(el)el.textContent=t;});}
const clock=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
let pushT=null,busy=false;
function schedulePush(){if(!sync.url)return;clearTimeout(pushT);setStatus("Saving to cloud...");pushT=setTimeout(push,1500);}
async function remoteGet(){
 const r=await fetch(sync.url+(sync.url.includes("?")?"&":"?")+"token="+encodeURIComponent(sync.token)+"&t="+Date.now());
 const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
async function push(){
 if(!sync.url||busy)return;busy=true;
 try{
  if(!s._ts)s._ts=Date.now();
  const r=await fetch(sync.url,{method:"POST",body:JSON.stringify({token:sync.token,ts:s._ts,state:JSON.stringify(s)})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"failed");
  sync.last=s._ts;saveSync();setStatus("Synced "+clock());
 }catch(e){setStatus("Not synced ("+(e.message||"offline")+"). Will retry.");}
 busy=false;
}
function applyRemote(j){
 s=JSON.parse(j.state);s._ts=j.ts;
 try{localStorage.setItem("camBudget",JSON.stringify(s));}catch(e){}
 sync.last=j.ts;saveSync();render();setStatus("Synced "+clock());
}
async function pull(){
 if(!sync.url||busy)return;
 try{
  setStatus("Checking cloud...");
  const j=await remoteGet();
  if(j.empty){await push();return;}
  const localChanged=(s._ts||0)>sync.last,remoteChanged=j.ts>sync.last;
  if(remoteChanged&&localChanged){
   if(confirm("This device and the cloud both changed since the last sync.\n\nOK = keep the CLOUD version (replaces this device)\nCancel = keep THIS DEVICE (replaces the cloud)"))applyRemote(j);else{s._ts=Date.now();await push();}
  }else if(remoteChanged)applyRemote(j);
  else if(localChanged)await push();
  else setStatus("Synced "+clock());
 }catch(e){setStatus("Offline or wrong link/password. Working on this device only.");}
}
async function connectSync(){
 const u=document.getElementById("sy_url").value.trim(),t=document.getElementById("sy_tok").value.trim();
 if(!u||!t){alert("Paste the web app link and your password.");return;}
 sync.url=u;sync.token=t;sync.last=0;saveSync();
 try{
  setStatus("Connecting...");
  const j=await remoteGet();
  if(j.empty){await push();}
  else if(confirm("The cloud already has data (from another device).\n\nOK = load the cloud data onto this device (replaces what is here)\nCancel = replace the cloud with THIS device's data"))applyRemote(j);
  else{s._ts=Date.now();await push();}
  render();
 }catch(e){sync.url="";saveSync();setStatus("Could not connect: "+e.message);alert("Could not connect. Check the link and the password, and that the web app is deployed with access 'Anyone'.");}
}
function disconnectSync(){if(confirm("Stop syncing on this device? Your data stays here and in the Sheet.")){sync.url="";sync.token="";sync.last=0;saveSync();setStatus("");render();}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull();});
window.addEventListener("online",pull);

}
render();
